name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SERIAL: drift-free reference oracle. cc -O3, no MPI, one process reads
          # the whole file. No apt install -> fastest lane.
          - backend: serial
            needs_mpi: false
            cc: cc
            cflags: "-O3 -march=native -D_FILE_OFFSET_BITS=64 -Wall"
            run: "./l1_pipeline"
          # THREADS: cc -pthread, N pthreads each own a byte-range, in-process merge.
          # No apt install (no OpenMP, no MPI) -> fastest lane.
          - backend: threads
            needs_mpi: false
            cc: cc
            cflags: "-O3 -march=native -pthread -DUSE_THREADS -D_FILE_OFFSET_BITS=64 -Wall"
            run: "./l1_pipeline --threads 2"
          # MPI: current behavior, unchanged. Keeps the libopenmpi-dev install.
          - backend: mpi
            needs_mpi: true
            cc: mpicc
            cflags: "-O3 -march=native -DUSE_MPI -D_FILE_OFFSET_BITS=64 -Wall"
            run: "mpirun --allow-run-as-root -np 1 ./l1_pipeline"

    name: build-and-smoke (${{ matrix.backend }})
    steps:
      - uses: actions/checkout@v5

      - name: Install MPI toolchain
        if: ${{ matrix.needs_mpi }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenmpi-dev openmpi-bin

      - name: Build l1_pipeline (${{ matrix.backend }})
        run: |
          ${{ matrix.cc }} ${{ matrix.cflags }} \
            -o l1_pipeline scripts/l1_pipeline.c -lm

      - name: Generate a tiny synthetic FASTA
        # No data is committed to the repo; the smoke test builds its own input.
        # ~200 short random-ish records with a handful of exact duplicates so the
        # novelty stage has something to collapse.
        run: |
          python3 - <<'PY'
          import random
          random.seed(1)
          base = "".join(random.choice("ACGT") for _ in range(300))
          recs = []
          for i in range(200):
              # mutate the base a little for most, duplicate it exactly for some
              if i % 20 == 0:
                  s = base                      # exact duplicate -> should be collapsed
              else:
                  s = list(base)
                  for _ in range(random.randint(1, 15)):
                      p = random.randrange(len(s))
                      s[p] = random.choice("ACGT")
                  s = "".join(s)
              recs.append(f">rec{i}|2021-0{i%9+1}-15\n{s}\n")
          open("smoke.fasta", "w").write("".join(recs))
          print("wrote smoke.fasta with", len(recs), "records")
          PY

      - name: Smoke test (${{ matrix.backend }})
        # Short records, so drop min-len to 200 and relax N-fraction.
        # Each backend uses the same synthetic FASTA and the same
        # emit-then-count-promoted assertion pattern.
        run: |
          ${{ matrix.run }} \
            --input smoke.fasta --min-len 200 --max-n-frac 0.5 \
            --warmup 50 --emit-promoted out
          echo "--- promoted records (${{ matrix.backend }}) ---"
          cat out.rank*.fasta > promoted.fasta || true
          n=$(grep -c '^>' promoted.fasta || echo 0)
          echo "promoted: $n"
          test "$n" -ge 1

  # Extra MPI-only check: coverage-invariance across rank counts. The exact
  # promoted *count* drifts at cluster margins (see l1_novelty.c); on a tiny
  # synthetic set that drift is a large fraction of a small count, so this is
  # reported, not gated. The hard build + smoke assertions above are the real
  # gate. Kept as a separate job so it does not slow the serial/threads lanes.
  mpi-multirank-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MPI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenmpi-dev openmpi-bin

      - name: Build l1_pipeline (mpi)
        run: |
          mpicc -O3 -march=native -DUSE_MPI -D_FILE_OFFSET_BITS=64 -Wall \
            -o l1_pipeline scripts/l1_pipeline.c -lm

      - name: Generate a tiny synthetic FASTA
        run: |
          python3 - <<'PY'
          import random
          random.seed(1)
          base = "".join(random.choice("ACGT") for _ in range(300))
          recs = []
          for i in range(200):
              if i % 20 == 0:
                  s = base
              else:
                  s = list(base)
                  for _ in range(random.randint(1, 15)):
                      p = random.randrange(len(s))
                      s[p] = random.choice("ACGT")
                  s = "".join(s)
              recs.append(f">rec{i}|2021-0{i%9+1}-15\n{s}\n")
          open("smoke.fasta", "w").write("".join(recs))
          print("wrote smoke.fasta with", len(recs), "records")
          PY

      - name: Single-rank baseline
        run: |
          mpirun --allow-run-as-root -np 1 ./l1_pipeline \
            --input smoke.fasta --min-len 200 --max-n-frac 0.5 \
            --warmup 50 --emit-promoted out
          cat out.rank*.fasta > promoted.fasta
          test "$(grep -c '^>' promoted.fasta)" -ge 1

      - name: Multi-rank run (report rank-count drift, informational)
        # The property the trigger guarantees is coverage-invariance across rank
        # counts; the exact promoted *count* drifts at cluster margins (see
        # l1_novelty.c). On a tiny synthetic set that drift is a large fraction
        # of a small count, so we report it rather than gate on it.
        run: |
          # hosted runners expose few MPI slots; oversubscribe to force 2 ranks
          mpirun --allow-run-as-root --oversubscribe -np 2 ./l1_pipeline \
            --input smoke.fasta --min-len 200 --max-n-frac 0.5 \
            --warmup 50 --emit-promoted out2
          cat out2.rank*.fasta > promoted2.fasta
          n1=$(grep -c '^>' promoted.fasta)
          n2=$(grep -c '^>' promoted2.fasta)
          d=$(( n1 > n2 ? n1 - n2 : n2 - n1 ))
          echo "promoted: np1=$n1  np2=$n2  (margin drift: $d)"
          # sanity only: 2 ranks must still promote a non-trivial subset
          test "$n2" -ge 1
